name: CI

on:
  push:
    branches:
      - main
      - 'cypack-*'
  pull_request:
    branches:
      - main
      - 'cypack-*'

permissions:
  contents: read
  id-token: write

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # There is no `azure/setup-bicep` action — referencing it failed the job at
    # "Prepare all required actions" with "repository not found", before a single
    # step ran. The runner ships the Azure CLI, which installs bicep to
    # ~/.azure/bin; check-bicep.sh invokes a bare `bicep`, so put that directory
    # on PATH rather than calling `az bicep` from the script.
    - name: Install Bicep
      run: |
        az bicep install
        echo "$HOME/.azure/bin" >> "$GITHUB_PATH"
    # Compiles every template and type-checks main.bicepparam.example against
    # main.bicep. This is the only gate on the Azure stack that runs without an
    # Azure subscription, so it treats warnings as failures.
    - name: Check Bicep templates
      run: ./scripts/check-bicep.sh
    # `pnpm test` is workspace-only (pnpm-workspace.yaml is packages/* + apps/*),
    # so nothing else in CI runs scripts/*.test.sh. Without this the rewrite
    # suite — the only guard on a mode-600 .bicepparam holding the Linear client
    # secret and both OAuth tokens — would rot unnoticed, along with the
    # image-pin allowlist it also covers.
    - name: Test deploy scripts
      run: |
        bash scripts/deploy-router-image.test.sh
        bash scripts/deploy-worker-image.test.sh
        bash scripts/bootstrap-azure-role-assignments.test.sh

  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
    - uses: actions/checkout@v7
    
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        package-manager-cache: false
    
    - name: Install dependencies
      uses: ./.github/actions/install-dependencies
    
    - name: Create .env file
      run: |
        cat > .env << EOF
        LINEAR_WEBHOOK_SECRET=test
        WEBHOOK_PORT=3000
        WORKSPACE_BASE_DIR=./tmp/workspaces
        PROMPT_TEMPLATE_PATH=./examples/prompt-template.txt
        ANTHROPIC_API_KEY=test
        EOF
    
    - name: Run Biome
      run: pnpm biome ci
    
    - name: Build Packages
      run: pnpm build
    
    - name: Run Tests
      run: pnpm -r test:run
    
    - name: Upload coverage
      uses: codecov/codecov-action@v7
      continue-on-error: true
      with:
        directory: ./coverage/
        fail_ci_if_error: false
        use_oidc: true
