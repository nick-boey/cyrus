packages:
  - packages/*
  - apps/*

# NOTE: pnpm >=10.x no longer reads the `pnpm` field in package.json.
# `onlyBuiltDependencies` and `overrides` live here and ONLY here — an entry
# added back to package.json is silently inert. See CLAUDE.md.

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - better-sqlite3
  - core-js
  - electron
  - electron-winstaller
  - esbuild
  - sharp
  - sqlite3
  - workerd

# Security floors for transitive dependencies, migrated from the (previously
# inert) root package.json `pnpm.overrides` block. Prefer bumping the owning
# direct dependency over adding an entry here, and drop entries that a later
# dep bump makes redundant — see the Dependency Security Policy in CLAUDE.md.
overrides:
  '@anthropic-ai/sdk': '>=0.115.0'
  '@grpc/grpc-js': '>=1.14.4'
  '@hono/node-server': '>=2.0.5'
  '@isaacs/brace-expansion': '>=5.0.1'
  '@modelcontextprotocol/sdk': '>=1.30.0'
  '@opentelemetry/core': '>=2.8.0'
  '@opentelemetry/exporter-prometheus': '>=0.217.0'
  '@opentelemetry/propagator-jaeger': '>=2.9.0'
  '@opentelemetry/sdk-node': '>=0.217.0'
  '@tootallnate/once': '>=3.0.1'
  ajv: '>=8.18.0'
  body-parser: '>=2.3.0'
  brace-expansion: '>=5.0.9'
  diff: '>=8.0.3'
  esbuild: '>=0.28.1'
  fast-uri: '>=4.1.2'
  flatted: '>=3.4.0'
  form-data@^2.0.0: 2.5.6
  form-data@^4.0.0: 4.0.6
  hono: '>=4.12.34'
  ip-address: '>=10.3.1'
  js-yaml: '>=5.2.2'
  jws: '>=4.0.1'
  minimatch: '>=3.1.4'
  glob>minimatch: '>=10.2.3'
  nodemon>minimatch: '>=10.2.3'
  test-exclude>minimatch: '>=10.2.3'
  picomatch: '>=4.0.4'
  postcss: '>=8.5.26'
  protobufjs: '>=8.6.5'
  qs: '>=6.15.2'
  rollup: '>=4.59.0'
  semver: '>=7.5.2'
  shell-quote: '>=1.9.0'
  simple-git: '>=3.36.0'
